services:
  # 1. FastAPI OCR & Extraction Microservice
  - type: web
    name: medassist-ai-fastapi
    env: docker
    dockerfilePath: fastapi-service/Dockerfile
    dockerContext: fastapi-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel frontend URL, e.g., https://medassist-ai.vercel.app

  # 2. Node.js / Express Core Backend API
  - type: web
    name: medassist-ai-backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: medassist-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FASTAPI_OCR_URL
        fromService:
          type: web
          name: medassist-ai-fastapi
          property: host
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel frontend URL, e.g., https://medassist-ai.vercel.app
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465

databases:
  # 3. Managed PostgreSQL Database
  - name: medassist-db
    plan: free
    region: oregon
    databaseName: medassist
    user: medassist_user
